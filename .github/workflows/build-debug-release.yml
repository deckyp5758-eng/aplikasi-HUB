name: Build H033 Debug Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-debug-release.yml'

permissions:
  contents: write

concurrency:
  group: h033-debug-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish H033 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK only
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK metadata
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/H033-debug-v1.3.0-code6.apk
          ls -lh release-assets/H033-debug-v1.3.0-code6.apk

      - name: Publish v1.3.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Rilis v1.3.0 - Koreksi Odometer & Pembaruan Otomatis
          body: |
            ### Apa yang baru di versi 1.3.0:
            - Mode Koreksi Odometer dengan alasan wajib dan konfirmasi.
            - Audit trail koreksi pada sheet KOREKSI KM.
            - Validasi koreksi pada Android dan Apps Script.
            - Pemeriksaan update debug melalui GitHub Release.
            - Peningkatan sinkronisasi dan stabilitas aplikasi H033.

            Varian yang dipublikasikan: APK DEBUG saja.
          files: release-assets/H033-debug-v1.3.0-code6.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
