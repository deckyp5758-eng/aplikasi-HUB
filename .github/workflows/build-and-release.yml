name: Build APK and Create Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release H033 APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Prepare Secrets & Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug -x test -x lint --stacktrace -Dorg.gradle.daemon=true -Dorg.gradle.parallel=false

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          APK_SRC=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "::error::File APK tidak ditemukan!"
            exit 1
          fi

          VNAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' | tr -d '[:space:]')
          VCODE=$(grep "versionCode" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/' | tr -d '[:space:]')
          
          if [ -z "$VNAME" ]; then VNAME="1.4.0"; fi
          if [ -z "$VCODE" ]; then VCODE="7"; fi

          APK_DEST="H033-v${VNAME}-code${VCODE}.apk"
          cp "$APK_SRC" "$APK_DEST"

          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VNAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_DEST" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.prepare_apk.outputs.tag_name }}
          APK_PATH: ${{ steps.prepare_apk.outputs.apk_path }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Memperbarui rilis $TAG_NAME..."
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            echo "Membuat rilis baru $TAG_NAME..."
            gh release create "$TAG_NAME" "$APK_PATH" \
              --title "Release $TAG_NAME" \
              --notes "Pembaruan Aplikasi H033 $TAG_NAME"
          fi
