name: Auto Build and GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Executable
        run: |
          chmod +x ./gradlew || true

      - name: Extract Version Info
        id: version_info
        shell: bash
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n1 | tr -cd '0-9')

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to extract version info from app/build.gradle.kts"
            exit 1
          fi

          TAG="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

          echo "Detected Version Name: ${VERSION_NAME}"
          echo "Detected Version Code: ${VERSION_CODE}"
          echo "Detected Tag: ${TAG}"

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: Prepare APK Asset
        id: prepare_apk
        shell: bash
        run: |
          VNAME="${{ steps.version_info.outputs.version_name }}"
          VCODE="${{ steps.version_info.outputs.version_code }}"
          
          # Temukan APK hasil build
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Error: File APK tidak ditemukan di folder build outputs!"
            exit 1
          fi

          FINAL_APK_NAME="H033-v${VNAME}-code${VCODE}.apk"
          cp "$APK_FILE" "$FINAL_APK_NAME"
          echo "apk_file_path=${FINAL_APK_NAME}" >> $GITHUB_OUTPUT
          echo "Berhasil menyiapkan file release: $FINAL_APK_NAME"

      - name: Create or Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_info.outputs.tag_name }}
          VNAME: ${{ steps.version_info.outputs.version_name }}
          VCODE: ${{ steps.version_info.outputs.version_code }}
          APK_PATH: ${{ steps.prepare_apk.outputs.apk_file_path }}
        run: |
          TITLE="Rilis ${TAG} - Pembaruan Aplikasi H033"
          NOTES=$(cat << 'EOF'
          ### Pembaruan H033
          - **Versi**: v1.4.0 (Build Code: 7)
          - **Fitur Terbaru**:
            - Tampilan riwayat log & foto nota BBM berdampingan dengan foto odometer (7 hari terakhir).
            - Tombol toggle 7 hari / Lihat Semua.
            - Fitur in-app update otomatis langsung dari aplikasi driver.
          EOF
          )

          echo "Membuat atau memperbarui release $TAG di GitHub..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada, mengunggah ulang asset APK..."
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            echo "Membuat release baru $TAG..."
            gh release create "$TAG" "$APK_PATH" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
          echo "Selesai mempublikasikan release $TAG!"
