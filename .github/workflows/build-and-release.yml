name: Build APK and Create Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release H033 APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Prepare Signing Keystore
        id: keystore
        shell: bash
        env:
          SECRET_B64: ${{ secrets.H033_DEBUG_KEYSTORE_BASE64 }}
        run: |
          SIGNING_DIR="${RUNNER_TEMP}/h033-signing"
          mkdir -p "$SIGNING_DIR"
          KEYSTORE_PATH="$SIGNING_DIR/debug.keystore"

          # Prioritas 1: Secret dari GitHub Actions
          # Prioritas 2: File debug.keystore.base64 di repo jika ada
          # Prioritas 3: Embedded Base64 asli H033 (SHA-256: 8B:7E:65:17:...)
          if [ -n "$SECRET_B64" ]; then
            echo "Menggunakan signing key dari GitHub Secrets..."
            echo "$SECRET_B64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_PATH"
          elif [ -f "debug.keystore.base64" ]; then
            echo "Menggunakan signing key dari file debug.keystore.base64..."
            cat "debug.keystore.base64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_PATH"
          else
            echo "Menggunakan embedded signing key asli H033..."
            cat << 'KEYB64' | tr -d '\r\n ' | base64 -d > "$KEYSTORE_PATH"
          
          KEYB64
          fi

          chmod 600 "$KEYSTORE_PATH"

          # Verifikasi bahwa file keystore valid
          keytool -list -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey >/dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::File keystore tidak valid atau password/alias salah!"
            exit 1
          fi

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "Signing Keystore berhasil disiapkan dan divalidasi."

      - name: Extract App Version from Gradle
        id: app_version
        run: |
          VNAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' | tr -d '[:space:]')
          VCODE=$(grep "versionCode" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/' | tr -d '[:space:]')
          
          if [ -z "$VNAME" ]; then VNAME="1.4.0"; fi
          if [ -z "$VCODE" ]; then VCODE="7"; fi

          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VNAME" >> "$GITHUB_OUTPUT"
          echo "release_name=Release v$VNAME (Code $VCODE)" >> "$GITHUB_OUTPUT"
          echo "Version: v$VNAME (Code $VCODE)"

      - name: Build Debug APK with Signing
        env:
          H033_DEBUG_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          H033_DEBUG_STORE_PASSWORD: ${{ secrets.H033_DEBUG_STORE_PASSWORD || 'android' }}
          H033_DEBUG_KEY_ALIAS: ${{ secrets.H033_DEBUG_KEY_ALIAS || 'androiddebugkey' }}
          H033_DEBUG_KEY_PASSWORD: ${{ secrets.H033_DEBUG_KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew :app:validateSigningDebug :app:assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: Verify and Prepare APK for Release
        id: prepare_apk
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::File APK tidak ditemukan di $APK_SRC!"
            exit 1
          fi

          VNAME="${{ steps.app_version.outputs.version_name }}"
          VCODE="${{ steps.app_version.outputs.version_code }}"
          APK_DEST="H033-v${VNAME}-code${VCODE}.apk"
          cp "$APK_SRC" "$APK_DEST"

          echo "apk_path=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "APK siap: $APK_DEST ($(du -h "$APK_DEST" | cut -f1))"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.app_version.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.app_version.outputs.release_name }}
          APK_PATH: ${{ steps.prepare_apk.outputs.apk_path }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🚀 Rilis Pembaruan Aplikasi H033

          ### 📦 Informasi Rilis:
          - **Versi**: ${{ steps.app_version.outputs.version_name }}
          - **Version Code**: ${{ steps.app_version.outputs.version_code }}
          - **Kompatibilitas**: Menggunakan signing key resmi yang sama (dapat langsung di-update tanpa uninstall).

          ### 📥 Unduh APK:
          Silakan unduh file APK di bawah ini dan pasang langsung pada perangkat.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME sudah ada, mengunggah aset baru..."
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            echo "Membuat release baru $TAG_NAME..."
            gh release create "$TAG_NAME" "$APK_PATH" \
              --title "$RELEASE_NAME" \
              --notes-file release_notes.md
          fi

