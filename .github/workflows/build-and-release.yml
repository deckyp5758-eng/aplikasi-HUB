name: Auto Build and GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h033-build-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Version Info
        id: version_info
        shell: bash
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n1 | tr -cd '0-9')
          
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to extract version info from app/build.gradle.kts"
            exit 1
          fi

          TAG="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

          echo "Detected Version Name: ${VERSION_NAME}"
          echo "Detected Version Code: ${VERSION_CODE}"
          echo "Detected Tag: ${TAG}"

      - name: Check if Release Tag Already Exists
        id: check_tag
        shell: bash
        run: |
          TAG="${{ steps.version_info.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
            echo "exists=true" >> $GITHUB_OUTPUT
          elif git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote origin."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG is new."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        if: steps.check_tag.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          gradle :app:assembleDebug

      - name: Prepare APK Asset
        if: steps.check_tag.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VNAME="${{ steps.version_info.outputs.version_name }}"
          VCODE="${{ steps.version_info.outputs.version_code }}"
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_SRC" ]; then
            # Coba cari lokasi alternatif jika output path berbeda
            APK_SRC=$(find app/build/outputs/apk/ -name "*.apk" | head -n1)
          fi

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "APK file not found after build!"
            exit 1
          fi

          TARGET_APK="H033-v${VNAME}-code${VCODE}.apk"
          cp "$APK_SRC" "$TARGET_APK"
          echo "apk_path=${TARGET_APK}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $TARGET_APK"

      - name: Create GitHub Release and Upload APK
        if: steps.check_tag.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "Rilis ${{ steps.version_info.outputs.tag_name }} - Pembaruan Aplikasi H033"
          body: |
            ### Pembaruan H033 (${{ steps.version_info.outputs.tag_name }})
            - **Versi**: ${{ steps.version_info.outputs.version_name }} (Build Code: ${{ steps.version_info.outputs.version_code }})
            - **Fitur Baru**:
              - Tampilan riwayat log & foto nota BBM berdampingan dengan foto odometer (7 hari terakhir).
              - Tombol toggle 7 hari / Lihat Semua.
              - Peningkatan stabilitas sistem in-app update otomatis.
          draft: false
          prerelease: false
          files: |
            H033-v${{ steps.version_info.outputs.version_name }}-code${{ steps.version_info.outputs.version_code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
