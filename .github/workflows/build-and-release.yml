name: Build APK and Create Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Catatan Rilis"
        required: false
        default: "Pembaruan rutin aplikasi HUB KEDIRI"
      force_update:
        description: "Wajibkan pembaruan bagi driver lama"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: h033-apk-production-release
  cancel-in-progress: false

jobs:
  test_and_build:
    name: Test, Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Restore Keystore for Consistent In-Place Upgrade Signing
        env:
          SECRET_H033_KEYSTORE: ${{ secrets.H033_DEBUG_KEYSTORE_BASE64 }}
          SECRET_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          KEYSTORE_RESTORED=false

          # 1. Coba decode dari H033_DEBUG_KEYSTORE_BASE64 jika ada
          if [ -n "${SECRET_H033_KEYSTORE:-}" ]; then
            echo "Mencoba memulihkan keystore dari secret H033_DEBUG_KEYSTORE_BASE64..."
            CLEAN_B64=$(printf '%s' "$SECRET_H033_KEYSTORE" | tr -d '\r\n\t ')
            if printf '%s' "$CLEAN_B64" | base64 --decode > "$RUNNER_TEMP/candidate.keystore" 2>/dev/null && \
               keytool -list -keystore "$RUNNER_TEMP/candidate.keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              cp "$RUNNER_TEMP/candidate.keystore" ~/.android/debug.keystore
              cp "$RUNNER_TEMP/candidate.keystore" ./debug.keystore
              KEYSTORE_RESTORED=true
              echo "Keystore berhasil dipulihkan dari secret H033_DEBUG_KEYSTORE_BASE64 (alias: androiddebugkey)."
            else
              echo "::warning::Secret H033_DEBUG_KEYSTORE_BASE64 ada tetapi data base64 tidak valid / korup. Mencoba sumber berikutnya..."
            fi
          fi

          # 2. Coba decode dari ANDROID_KEYSTORE_BASE64 jika sumber 1 belum berhasil
          if [ "$KEYSTORE_RESTORED" = "false" ] && [ -n "${SECRET_ANDROID_KEYSTORE:-}" ]; then
            echo "Mencoba memulihkan keystore dari secret ANDROID_KEYSTORE_BASE64..."
            CLEAN_B64=$(printf '%s' "$SECRET_ANDROID_KEYSTORE" | tr -d '\r\n\t ')
            if printf '%s' "$CLEAN_B64" | base64 --decode > "$RUNNER_TEMP/candidate.keystore" 2>/dev/null && \
               keytool -list -keystore "$RUNNER_TEMP/candidate.keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              cp "$RUNNER_TEMP/candidate.keystore" ~/.android/debug.keystore
              cp "$RUNNER_TEMP/candidate.keystore" ./debug.keystore
              KEYSTORE_RESTORED=true
              echo "Keystore berhasil dipulihkan dari secret ANDROID_KEYSTORE_BASE64 (alias: androiddebugkey)."
            else
              echo "::warning::Secret ANDROID_KEYSTORE_BASE64 ada tetapi data base64 tidak valid / korup. Mencoba file repository..."
            fi
          fi

          # 3. Coba dari file lokal debug.keystore.base64 di root repo jika secret belum berhasil
          if [ "$KEYSTORE_RESTORED" = "false" ] && [ -s "debug.keystore.base64" ]; then
            echo "Memulihkan keystore dari repository file debug.keystore.base64..."
            CLEAN_B64=$(tr -d '\r\n\t ' < debug.keystore.base64)
            if printf '%s' "$CLEAN_B64" | base64 --decode > "$RUNNER_TEMP/candidate.keystore" 2>/dev/null && \
               keytool -list -keystore "$RUNNER_TEMP/candidate.keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              cp "$RUNNER_TEMP/candidate.keystore" ~/.android/debug.keystore
              cp "$RUNNER_TEMP/candidate.keystore" ./debug.keystore
              KEYSTORE_RESTORED=true
              echo "Keystore berhasil dipulihkan dari debug.keystore.base64 (alias: androiddebugkey)."
            fi
          fi

          # 4. Validasi final
          if [ "$KEYSTORE_RESTORED" = "true" ] && [ -s ~/.android/debug.keystore ]; then
            CERT_SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $2}')
            echo "Signing Keystore Fingerprint (SHA-256): $CERT_SHA256"
            echo "Keystore verifikasi: SUKSES (Konsistensi tanda tangan APK dijamin)."
          else
            echo "::error::Gagal memulihkan valid debug.keystore dari Secret maupun file repository! Build dibatalkan untuk mencegah APK terdistribusi dengan tanda tangan key baru."
            exit 1
          fi

      - name: Prepare Secrets & Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Run Unit Tests
        run: |
          echo "Menjalankan JVM unit tests..."
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --info

      - name: Validate & Prepare APK Asset
        id: prepare_apk
        run: |
          APK_SRC=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "::error::File APK tidak ditemukan pada direktori build output!"
            exit 1
          fi

          VNAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' | tr -d '[:space:]')
          VCODE=$(grep "versionCode" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/' | tr -d '[:space:]')
          
          if [ -z "$VNAME" ] || [ -z "$VCODE" ]; then
            echo "::error::Gagal mengekstrak versionName atau versionCode dari build.gradle.kts"
            exit 1
          fi

          APK_DEST="H033-v${VNAME}-code${VCODE}.apk"
          cp "$APK_SRC" "$APK_DEST"

          # Hitung Checksum SHA-256
          sha256sum "$APK_DEST" > "${APK_DEST}.sha256"
          CHECKSUM=$(cat "${APK_DEST}.sha256" | awk '{print $1}')
          echo "SHA256 Checksum: $CHECKSUM"

          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VNAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${APK_DEST}.sha256" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Upload APK & Checksum Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            ${{ steps.prepare_apk.outputs.checksum_path }}

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.prepare_apk.outputs.tag_name }}
          APK_PATH: ${{ steps.prepare_apk.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.prepare_apk.outputs.checksum_path }}
          NOTES: ${{ github.event.inputs.release_notes || 'Pembaruan Aplikasi HUB KEDIRI' }}
          CHECKSUM: ${{ steps.prepare_apk.outputs.checksum }}
        run: |
          BODY_CONTENT=$(cat <<EOF
          ${NOTES}

          ---
          ### Metadata Rilis:
          * **Versi Aplikasi:** \`${{ steps.prepare_apk.outputs.version_name }}\`
          * **Version Code:** \`${{ steps.prepare_apk.outputs.version_code }}\`
          * **SHA-256 Checksum:** \`${CHECKSUM}\`
          * **Commit SHA:** \`${{ github.sha }}\`
          EOF
          )

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Memperbarui rilis $TAG_NAME..."
            gh release upload "$TAG_NAME" "$APK_PATH" "$CHECKSUM_PATH" --clobber
            gh release edit "$TAG_NAME" --notes "$BODY_CONTENT"
          else
            echo "Membuat rilis baru $TAG_NAME..."
            gh release create "$TAG_NAME" "$APK_PATH" "$CHECKSUM_PATH" \
              --title "Release $TAG_NAME" \
              --notes "$BODY_CONTENT"
          fi
