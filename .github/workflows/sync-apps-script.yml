name: Sync H033 Apps Script

on:
  push:
    branches:
      - main
    paths:
      - app/src/main/assets/apps-script/**
      - AppsScriptCode.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h033-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_PROJECT_ID: 1sc4hIEKppa5pyTbes5i-BXrE4LaklUix9CJxEzCtl7jN8GcutUC_YFLM
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbxEXMxyio1bpUiVn9bOlWqf9tHfnqcWBK3WUPEJgVDGcR1nqNSC3nnnatXNiMJm1fzQ
  APPS_SCRIPT_WEB_APP_URL: https://script.google.com/macros/s/AKfycbxEXMxyio1bpUiVn9bOlWqf9tHfnqcWBK3WUPEJgVDGcR1nqNSC3nnnatXNiMJm1fzQ/exec

jobs:
  deploy:
    name: Update Apps Script and Redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate required secret and protected scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS_JSON" || {
            echo "::error::Missing repository secret CLASP_CREDENTIALS_JSON."
            exit 1
          }
          
          # Validasi bahwa CLASP_CREDENTIALS_JSON adalah JSON yang valid
          python3 -c "import json, os, sys; json.loads(os.environ['CLASP_CREDENTIALS_JSON'])" || {
            echo "::error::CLASP_CREDENTIALS_JSON is not a valid JSON structure."
            exit 1
          }

          canonical="$GITHUB_WORKSPACE/app/src/main/assets/apps-script/Code.gs"
          test -s "$canonical"
          if grep -qE '563918420|1474380133' "$canonical"; then
            echo "::error::Refusing to deploy: canonical Code.gs contains an obsolete GID."
            exit 1
          fi
          if grep -qE '(^|/|\\)BBM\\.gs$' <(find "$GITHUB_WORKSPACE" -type f -print); then
            echo "::error::Protected BBM.gs must not be included in this sync job."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 20

      - name: Install pinned clasp
        shell: bash
        run: npm install --global @google/clasp@3.4.0

      - name: Pull current Apps Script project and replace Code.gs & Index.html
        shell: bash
        run: |
          set -euo pipefail
          sync_dir="$(mktemp -d)"
          echo "SYNC_DIR=$sync_dir" >> "$GITHUB_ENV"

          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"%s"}\n' \
            "$APPS_SCRIPT_PROJECT_ID" "$sync_dir" > "$sync_dir/.clasp.json"
          chmod 600 "$sync_dir/.clasp.json"

          cd "$sync_dir"
          clasp pull

          # Catat version number aktif sebelum deployment untuk kemungkinan rollback
          clasp deployments --json > "$RUNNER_TEMP/deployments-before.json"
          PREV_VER=$(python3 -c "import json; d=json.load(open('$RUNNER_TEMP/deployments-before.json')); print(next((str(item.get('versionNumber','')) for item in d if item.get('deploymentId')=='$APPS_SCRIPT_DEPLOYMENT_ID'), ''))")
          echo "PREVIOUS_APPS_SCRIPT_VERSION=$PREV_VER" >> "$GITHUB_ENV"
          echo "Previous active Apps Script version: $PREV_VER"

          if find "$sync_dir" -type f -name 'BBM.gs' -print -quit | grep -q .; then
            echo "::error::Refusing to sync: BBM.gs exists in the target project."
            exit 1
          fi

          rm -f "$sync_dir/Code.gs"
          cp "$GITHUB_WORKSPACE/app/src/main/assets/apps-script/Code.gs" "$sync_dir/Code.js"
          
          if [ -f "$GITHUB_WORKSPACE/app/src/main/assets/apps-script/Index.html" ]; then
            cp "$GITHUB_WORKSPACE/app/src/main/assets/apps-script/Index.html" "$sync_dir/Index.html"
          fi

          test -s "$sync_dir/Code.js"
          test ! -e "$sync_dir/Code.gs"

      - name: Push source to Apps Script
        shell: bash
        run: |
          set -euo pipefail
          cd "$SYNC_DIR"
          clasp push --force

      - name: Create a new immutable version
        shell: bash
        run: |
          set -euo pipefail
          cd "$SYNC_DIR"
          description="GitHub ${GITHUB_SHA:0:7}"
          clasp version "$description" | tee "$RUNNER_TEMP/clasp-version.log"
          version="$(sed -nE 's/.*Created version ([0-9]+).*/\1/p' "$RUNNER_TEMP/clasp-version.log" | tail -n 1)"
          test -n "$version" || {
            echo "::error::Could not determine the newly created Apps Script version."
            exit 1
          }
          echo "APPS_SCRIPT_VERSION=$version" >> "$GITHUB_ENV"
          echo "Created new version: $version"

      - name: Update existing Web App deployment (clasp redeploy)
        shell: bash
        run: |
          set -euo pipefail
          cd "$SYNC_DIR"
          description="GitHub ${GITHUB_SHA:0:7}"
          
          # Gunakan perintah resmi clasp redeploy untuk in-place update tanpa ubah URL Web App
          clasp redeploy "$APPS_SCRIPT_DEPLOYMENT_ID" "$APPS_SCRIPT_VERSION" "$description"

          verified=0
          for attempt in $(seq 1 12); do
            clasp deployments --json > "$RUNNER_TEMP/deployments-after.json"
            if python3 - "$RUNNER_TEMP/deployments-before.json" "$RUNNER_TEMP/deployments-after.json" "$APPS_SCRIPT_DEPLOYMENT_ID" "$APPS_SCRIPT_VERSION" <<'PY'
          import json
          import sys

          before_path, after_path, expected_deployment, expected_version = sys.argv[1:]
          with open(before_path, encoding="utf-8") as handle:
              before = json.load(handle)
          with open(after_path, encoding="utf-8") as handle:
              after = json.load(handle)

          before_ids = sorted(item.get("deploymentId", "") for item in before)
          after_ids = sorted(item.get("deploymentId", "") for item in after)
          if before_ids != after_ids:
              print("Deployment set changed during update; refusing to continue.")
              raise SystemExit(2)

          for deployment in after:
              if deployment.get("deploymentId") == expected_deployment:
                  actual_version = str(deployment.get("versionNumber", ""))
                  if actual_version == expected_version:
                      print("Canonical deployment updated successfully to version " + actual_version)
                      break
                  print(f"Deployment still reports version {actual_version}; waiting for {expected_version}...")
                  raise SystemExit(1)
          else:
              print("Canonical Apps Script deployment ID was not found.")
              raise SystemExit(2)
          PY
            then
              verified=1
              break
            else
              result=$?
              if [ "$result" -eq 2 ]; then
                exit 1
              fi
              echo "Waiting for Apps Script deployment consistency (attempt $attempt/12)..."
              sleep 5
            fi
          done
          test "$verified" -eq 1 || {
            echo "::error::Canonical deployment did not expose the new version within 60 seconds."
            exit 1
          }

      - name: Verify Health Endpoint & Backward Compatibility
        shell: bash
        run: |
          set -euo pipefail
          
          echo "1. Memeriksa Health Endpoint (?action=health)..."
          health_res="$RUNNER_TEMP/h033-health.json"
          http_code="$(curl --fail-with-body -sS -L -o "$health_res" -w '%{http_code}' "${APPS_SCRIPT_WEB_APP_URL}?action=health" || echo "000")"
          
          if [ "$http_code" != "200" ]; then
            echo "Fallback check ?action=debug..."
            http_code="$(curl --fail-with-body -sS -L -o "$health_res" -w '%{http_code}' "${APPS_SCRIPT_WEB_APP_URL}?action=debug")"
          fi
          
          test "$http_code" = "200" || {
            echo "::error::Health check failed with HTTP $http_code."
            exit 1
          }
          
          python3 - "$health_res" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as h:
              data = json.load(h)
          if data.get("success") is not True:
              raise SystemExit("Backend health check returned success != true")
          print("Backend health check verified successfully.")
          PY

          echo "2. Memeriksa Legacy v1 Contract (?action=getDrivers)..."
          drivers_res="$RUNNER_TEMP/h033-drivers.json"
          d_code="$(curl --fail-with-body -sS -L -o "$drivers_res" -w '%{http_code}' "${APPS_SCRIPT_WEB_APP_URL}?action=getDrivers" || echo "000")"
          test "$d_code" = "200" || {
            echo "::error::Legacy getDrivers check failed with HTTP $d_code."
            exit 1
          }
          echo "Legacy v1 contract verified successfully."

      - name: Rollback on Failure
        if: failure() && env.PREVIOUS_APPS_SCRIPT_VERSION != ''
        shell: bash
        run: |
          echo "::warning::Deployment verification failed. Rolling back to previous version $PREVIOUS_APPS_SCRIPT_VERSION..."
          cd "$SYNC_DIR"
          clasp redeploy "$APPS_SCRIPT_DEPLOYMENT_ID" "$PREVIOUS_APPS_SCRIPT_VERSION" "Rollback on CI/CD Failure" || true
          echo "Rollback executed."
